# Shared by both sbt builds in this repo (scalafix/ and
# iceberg-spark-upgrade-wap-plugin/). They are independent builds, so neither picks
# a repo-root config up automatically -- each one points `scalafmtConfig` here
# explicitly. Keep it that way rather than growing a second copy that drifts.
version = 3.11.5
runner.dialect = scala213

# Matches the flake8 limit used on the Python side. Over the corpus this config
# actually formats, p95 is ~87 and p99 ~105, so 100 sits just BELOW p99: about 50
# lines (~1.5%) needed rewrapping when the formatter was first applied. (An earlier
# version of this comment claimed 100 was "just above" a p99 of 109 -- that 109 came
# from a corpus that included the testkit fixtures, which excludePaths below exempts,
# so it could never have justified the limit.)
maxColumn = 100

# Leave scaladoc alone. The default (Asterisk) re-wraps doc prose and shuffles the
# leading `*` markers, which is a much noisier change than reformatting code and
# has no upside on an existing codebase whose comments were written by hand.
docstrings.style = keep

# The scalafix testkit fixtures are NOT ordinary source.
#
#   input/  files carry a leading `/* rule = ... */` block that scalafix parses
#           as test configuration.
#   output/ files are the expected result of applying a rule, compared against
#           the rule's actual output. A formatter touching these would not be a
#           cosmetic change -- it would rewrite the assertions, and the suite
#           would either fail or, worse, start passing against reformatted
#           expectations that no longer match what the rule really emits.
#
# So both trees are off limits. Verified: `scalafmtCheckAll` leaves them alone
# and `tests/test` reports the same result before and after formatting.
#
# e2e_demo is excluded for a different reason: it is a third sbt build that the CI
# style step does NOT check, and its sources are deliberately old-style Spark 2.4
# code that the migration rules rewrite. Because this config now lives at the repo
# root, Metals/IntelliJ and a bare `scalafmt` would otherwise reformat exactly the
# inputs the demo asserts on, outside any gate. Keeping the config's scope equal to
# the gate's scope is the point.
project.excludePaths = [
  "glob:**/scalafix/input/**"
  "glob:**/scalafix/output/**"
  "glob:**/e2e_demo/**"
]
